name: Release

# Push a tag like v0.1.0 to build, test and publish a release.
# "Run workflow" (manual) builds and tests without publishing; the package is attached to the run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "::error::Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Build the self-contained package
        run: pnpm release

      - name: Test the package (fresh extract, no Node.js on PATH, demo mode, full lab suite)
        run: node scripts/release-smoke.mjs --port 3101

      - name: Test with a read-only install folder
        run: node scripts/release-smoke.mjs --port 3102 --readonly-data

      - uses: actions/upload-artifact@v7
        with:
          name: proxflow-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --title "ProxFlow $GITHUB_REF_NAME" --notes-file release/notes.md
